[project]
name = "chan-market-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
