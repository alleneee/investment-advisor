services:
  # PostgreSQL Database
  - type: pserv
    name: investment-advisor-db
    env: docker
    plan: free
    region: oregon
    
  # FastAPI Backend
  - type: web
    name: investment-advisor-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: investment-advisor-db
          property: connectionString
      - key: INTERNAL_AGENT_TOKEN
        generateValue: true
      - key: AGENT_RUNTIME_URL
        value: http://investment-advisor-agent:8081
      - key: PYTHON_API_BASE_URL
        fromService:
          type: web
          name: investment-advisor-api
          property: host
      - key: CORS_ORIGINS
        value: https://investment-advisor-web.onrender.com
      - key: MARKET_PROVIDER
        value: auto
      - key: PORT
        value: 8000
    healthCheckPath: /health
    
  # Node.js Agent Runtime
  - type: web
    name: investment-advisor-agent
    env: docker
    dockerfilePath: ./apps/agent-runtime/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: INTERNAL_AGENT_TOKEN
        sync: false
      - key: PYTHON_API_BASE_URL
        value: http://investment-advisor-api:8000
      - key: PI_AGENT_PORT
        value: 8081
      - key: PORT
        value: 8081
    healthCheckPath: /health/live
    
  # React Frontend
  - type: web
    name: investment-advisor-web
    env: docker
    dockerfilePath: ./apps/web/Dockerfile
    plan: free
    region: oregon
    buildCommand: cd apps/web && VITE_API_BASE_URL=https://investment-advisor-api.onrender.com npm run build
    healthCheckPath: /

databases:
  - name: investment-advisor-db
    databaseName: chan_market
    user: chan_user
    plan: free
    region: oregon
