# fly.toml app configuration file generated for investment-advisor-web
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "investment-advisor-web"
primary_region = "sjc"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PORT = "80"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "get"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
